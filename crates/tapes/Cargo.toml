[package]
name = "tapes-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Read, list, and export coding-agent sessions across harnesses."
keywords = ["cli", "sessions", "transcripts", "agents"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
zip = ["tapes-core/zip", "dep:zip"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tapes-core.workspace = true
zip = { workspace = true, optional = true }

[dev-dependencies]
chrono.workspace = true
sha2.workspace = true

[[bin]]
name = "tapes"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "supplied-input-audit"
path = "tests/supplied_input_audit.rs"
